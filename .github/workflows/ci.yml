name: CI

on:
    push:
        branches: [ 6.0 ]
    pull_request:
        branches: [ 6.0 ]

permissions:
    contents: read

env:
    XDEBUG_MODE: coverage

jobs:
    backend:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                php-versions: [ '8.4' ]
                composer-prefer: [ '', '--prefer-lowest' ]

        steps:
            -   uses: actions/checkout@v6

            -   name: Install PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php-versions }}
                    #                  extensions: intl #optional
                    ini-values: "post_max_size=256M" #optional

            -   name: Check PHP Version
                run: php -v

            -   name: Validate composer.json and composer.lock
                run: composer validate --strict

            -   name: Cache Composer packages
                id: composer-cache
                uses: actions/cache@v5
                with:
                    path: vendor
                    key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
                    restore-keys: |
                        ${{ runner.os }}-php-

            -   name: Install dependencies
                run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.composer-prefer }}

            -   name: Run phpstan
                run: ./vendor/bin/phpstan analyse

            -   name: Run tests
                run: ./vendor/bin/phpunit --coverage-text --coverage-html=.phpunit.cache/html-report --coverage-clover=clover.xml

            -   name: Run rector
                run: ./vendor/bin/rector process src tests --dry-run

            -   name: Run yaml lint
                run: |
                    ./vendor/bin/yaml-lint .github/ -vvv --parse-tags
                    ./vendor/bin/yaml-lint config/ -vvv --parse-tags
                    ./vendor/bin/yaml-lint translations/ -vvv --parse-tags

            -   name: Code Style check
                run: ./vendor/bin/php-cs-fixer fix -v --diff --dry-run

            -   name: Upload coverage to Codecov
                uses: codecov/codecov-action@v6
                with:
                    files: clover.xml
                    fail_ci_if_error: true
                    token: ${{ secrets.CODECOV_TOKEN }}

    frontend:
        needs: backend
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node-versions: [ '20' ]
                npm-versions: [ '10' ]

        steps:
            -   uses: actions/checkout@v6

            -   name: Install Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: ${{ matrix.node-versions }}

            -   name: Check Node.js Version
                run: node -v

            -   name: Check npm Version
                run: npm -v

            -   name: Cache npm packages
                id: npm-cache
                uses: actions/cache@v5
                with:
                    path: node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
                    restore-keys: |
                        ${{ runner.os }}-node-

            -   name: Install npm dependencies
                run: npm install --no-package-lock --no-audit --no-fund

            -   name: Run eslint
                run: npm run lint

    build-dist:
        needs: frontend
        runs-on: ubuntu-latest
        permissions:
            contents: write

        env:
            CI_COMMIT_MESSAGE: Continuous Integration Assets Build Artifacts
            CI_COMMIT_AUTHOR: Continuous Integration
            BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

        steps:
            -   uses: actions/checkout@v6
                with:
                    ref: ${{ env.BRANCH_NAME }}

            -   name: Install Node.js
                uses: actions/setup-node@v6
                with:
                    node-version: '20'

            -   name: Cache npm packages
                id: npm-cache
                uses: actions/cache@v5
                with:
                    path: node_modules
                    key: ${{ runner.os }}-node-${{ hashFiles('package.json') }}
                    restore-keys: |
                        ${{ runner.os }}-node-

            -   name: Install npm dependencies
                run: npm install --no-package-lock --no-audit --no-fund

            -   name: Build dist
                run: npm run build

            -   name: Check dist is clean on pull requests
                if: github.event_name == 'pull_request'
                run: |
                    if [ -n "$(git status --porcelain -- assets/dist)" ]; then
                        git status --short -- assets/dist
                        exit 1
                    fi

            -   name: Commit dist changes
                if: github.event_name == 'push'
                run: |
                    if [ -z "$(git status --porcelain -- assets/dist)" ]; then
                        exit 0
                    fi

                    git config user.name "${{ env.CI_COMMIT_AUTHOR }}"
                    git config user.email "username@users.noreply.github.com"
                    git add assets/dist
                    git commit -m "${{ env.CI_COMMIT_MESSAGE }}"
                    git push origin HEAD:${{ env.BRANCH_NAME }}
